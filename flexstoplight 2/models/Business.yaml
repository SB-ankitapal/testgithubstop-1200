title: Business
x-stoplight:
  id: 0iziputmwbjvu
type: object
description: Represents a business
properties:
  id:
    type: string
    format: uuid
    description: Business identifier
    readOnly: true
    x-stoplight:
      id: 8e808033aah45
  accountId:
    type: string
    format: uuid
    description: Account identifier
    readOnly: true
    x-stoplight:
      id: eqw7cl9yerevg
  active:
    type: boolean
