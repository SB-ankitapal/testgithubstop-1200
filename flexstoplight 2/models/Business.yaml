    maxLength: 6
    x-stoplight:
      id: elw6fova5enl5
  duns:
    type: string
    description: 'The [Dun & Bradstreet Number](https://www.dnb.com/duns.html) of the business'
    minLength: 9
    maxLength: 9
    x-stoplight:
      id: u26ro2m2xdmq5
  mcc:
    type: string
    description: 'The [Merchant Category Code](https://en.wikipedia.org/wiki/Merchant_category_code) of the business'
